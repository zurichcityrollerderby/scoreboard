name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release artifacts
        run: ./gradlew shadowJar prepareContainer -PisRelease=true
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
            build/jreleaser/prepare/container/docker/
      - name: Create release and upload executable JAR
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/scoreboard-${{ github.ref_name }}.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'legacy' }}

  installers:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            files: |
              *.deb
              *.rpm
          - os: ubuntu-22.04-arm
            files: |
              *.deb
              *.rpm
          - os: macos-15
            files: '*.dmg'
          - os: macos-15-intel
            files: '*.dmg'
          - os: windows-2022
            files: '*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: build
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Setup Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WIX/bin/candle.exe")) {
            throw 'WiX 3 is required to build the Windows installer'
          }
          "$env:WIX/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Assemble installers
        shell: bash
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer_version="${GITHUB_REF_NAME#v}"
          installer_version="${installer_version%%-*}"
          ./gradlew jreleaserAssemble -PisRelease=true -PinstallerVersion="$installer_version" -PprebuiltArtifacts=true -x assembleDist -x shadowJar -x installDist
      - name: Upload installers to release
        uses: softprops/action-gh-release@v3
        with:
          working_directory: build/jreleaser/assemble/scoreboard/jpackage
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true

  containers:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: build
      - name: Set container image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push multi-platform container
        uses: docker/build-push-action@v7
        with:
          context: build/jreleaser/prepare/container/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
